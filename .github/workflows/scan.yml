{"name":"Base arb scan","on":{"workflow_dispatch":{"inputs":{"minutes":{"description":"How many minutes to scan","default":"5"}}},"schedule":[{"cron":"17 */2 * * *"}]},"jobs":{"scan":{"runs-on":"ubuntu-latest","timeout-minutes":20,"steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-node@v4","with":{"node-version":20}},{"run":"npm install"},{"name":"Health check","run":"npm run health","env":{"RPC_URL":"${{ secrets.BASE_RPC_URL || 'https://mainnet.base.org' }}"}},{"name":"Scan","run":"DURATION_SEC=$(( ${MINUTES:-5} * 60 )) npm run scan","env":{"RPC_URL":"${{ secrets.BASE_RPC_URL || 'https://mainnet.base.org' }}","MINUTES":"${{ github.event.inputs.minutes }}"}},{"uses":"actions/upload-artifact@v4","if":"always()","with":{"name":"scan-results-${{ github.run_id }}","path":"results/"}}]}}}
